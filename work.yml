# The default workflow: eight Status values, six verbs typed by the daemon, and the agents those
# verbs spawn (examples/default/README.md). Every key and its meaning: docs/user/reference/work-yml.md.
#
# `work init --template default` writes `board:` with the board it creates, and `base:` with this repo's
# default branch; edit `base` if worktrees should branch from another. `branch` and `worktree.path`
# are left out so the machine-wide naming in ~/.work/config.yml applies.
board: https://github.com/users/jawache/projects/16
base: main

agents:                                              # the model each agent runs on; one left out, or with no model, runs on Claude Code's default
  leader:   { model: opus }                          # this issue's session: passed to claude as --model
  builder:  { model: opus }                          # the others are read by the repo's skill, which passes each when it spawns that agent
  secops:   { model: opus }
  codeops:  { model: opus }
  docops:   { model: opus }
  devops:   { model: opus }
permissions: auto                                    # passed to claude as --permission-mode
field: Status                                        # the single-select field whose value is the card's state
teardown: archived                                   # archiving the card tears the session and its worktree down
labels:                                              # the daemon mirrors each session's state onto its issue as one of these four labels
  running:   running
  idle:      idle
  needs_you: needs-you                               # on while a Needs you the app posted waits on the human's answer
  ended:     ended

worktree:                                            # flow guards itself through dist/, which git does not carry: install and build before the session starts, or every tool call is refused
  create: "git -C {repo} worktree add {path} -b {branch} origin/{base} && cd {path} && just install && just build"
  existing: "git -C {repo} worktree prune && git -C {repo} worktree add {path} {branch} && cd {path} && just install && just build"
  remove: "git -C {repo} worktree remove {path} && git -C {repo} branch -D {branch}"

events:                                              # each `send` is the text typed into the issue's session when the event happens

  from: []                                           # logins relayed besides the repo's owner, members and collaborators

  created: |
    [work] You are the session for issue #{issue} in {repo_name}, on branch {branch} in {worktree}.
    You act on GitHub as @{app}, only through `work gh`, never a bare gh; the human is @{human}, @mention them when you need them.
    Lines starting with [work] relay GitHub activity on this issue, its sub-issues and its pull request.

  resumed: |
    [work] This session was resumed. Re-read issue #{issue} on GitHub, including its sub-issues and pull request, and continue from where it stands.

  status:                                            # one entry per Status value; `icon` is shown in the TUI's rows, `send` is typed when a card enters the value, a list as one message per item
    Backlog: { icon: "📥" }
    Triage:  { icon: "🔍", send: "[work] /work triage {issue}" }
    Plan:    { icon: "📝", send: "[work] /work plan {issue}" }
    Build:   { icon: "🔨", send: "[work] /work start {issue}: open every message that ends your turn with the recap" }
    Demo:    { icon: "🎬", send: "[work] /work demo {issue}: write the recap of the build first" }
    Review:  { icon: "👀", send: "[work] /work review {issue}" }
    Merge:   { icon: "🔀", send: "[work] /work merge {issue}" }
    Done:    { icon: "✅" }

  comment: |
    [work] @{author} commented on issue #{number}{parent} ({url})
    {body}

  review: |
    [work] @{author} {state} PR #{pr} ({url})
    {comments}
    Overall: {body}

  review_comment: |
    [work] @{author} commented on PR #{pr}, {path} line {line} ({url})
    {body}

  pr_comment: |
    [work] @{author} commented on PR #{pr} ({url})
    {body}

  check: |
    [work] check "{name}" {conclusion} on PR #{pr} ({url})

  merged: |
    [work] PR #{pr} merged into {base}
