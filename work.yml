# The default workflow: nine status values, seven verbs typed by the daemon, and the agents those
# verbs spawn (examples/default/README.md). Every key and its meaning: docs/user/reference/work-yml.md.
#
# `work init --template default` writes `name:` with the repo's folder name and `base:` with this repo's
# default branch; edit `base` if worktrees should branch from another. The issues are in the record, `.work`
# in the main checkout (docs/user/reference/record.md § Where the record is). `branch` is left out, and the
# environment's {path} is, so the machine-wide naming in ~/.work/config.yml applies.
name: flow                                           # the project's name; its issues' ids are flow-1, flow-2 …
base: main

agents:                                              # what claude is started as; a key left out runs on Claude Code's default
  leader:   { model: opus, effort: high, permissions: bypassPermissions }   # this issue's session: passed to claude as --model, --effort and --permission-mode
                                                     # add mcp: <file> for only that MCP config's servers, or mcp: off for none; left out, every server Claude Code is configured with
  builder:  { model: opus, effort: high }            # the others are read by the repo's skill, which passes both when it spawns that agent
  secops:   { model: opus, effort: high }
  tech-lead: { model: opus, effort: high }
  tech-editor: { model: opus, effort: high }
  tech-writer: { model: opus, effort: high }
  devops:   { model: opus, effort: high }
  coach:    { model: opus, effort: high }
chats:                                               # summary runs when a chat's first turn ends: the conversation on stdin, the title and two summary lines on stdout
  summary: 'claude -p --model haiku --tools "" --no-session-persistence --system-prompt "You title and summarise conversations, and never reply to them. Print three lines and nothing else. Line 1 is a title, at most eight words. Line 2 is one sentence, at most 25 words, on what the conversation was about. Line 3 is one sentence, at most 25 words, on what was decided or done. Start each line with its content, never a label. No Markdown. No blank lines." "Title and summarise the conversation above."'

environments:                                        # flow guards itself through dist/, which git does not carry: install and build before the session starts, or every tool call is refused
  worktree:
    create: "git -C {repo} worktree add {path} -b {branch} origin/{base} && cd {path} && just install && just build && echo {path}"
    existing: "git -C {repo} worktree prune && git -C {repo} worktree add {path} {branch} && cd {path} && just install && just build && echo {path}"
    remove: "git -C {repo} worktree remove {folder} && git -C {repo} branch -D {branch}"

sessions:                                            # default is every numbered issue's session; any other entry is a standing issue
  default:
    environment: worktree
    agent: leader
    sleep_after: 1h                                  # how long a session is idle before its leader is put to sleep; 0 or off never sleeps
    teardown: archived                               # archived: true in an issue's front matter tears its session and its worktree down
    started: |
      [work] You are the session for issue {issue}, whose record is .work/{issue}/, on branch {branch} in {folder}.
      Lines starting with [work] relay the daemon: a move, and a merge of this issue's branch.
    resumed: |
      [work] This session was resumed. Re-read .work/{issue}/, its issue.md, its tasks and its log, and continue from where it stands.

fields:                                              # every field is a key in each issue's front matter; status is the one the daemon acts on
  status:
    default: Backlog
    values:                                          # icon is shown in the session list's rows; action is typed when an issue enters the value, a list as one message per item, a line starting with ! run as a shell command
      - { name: Backlog, icon: "📥" }
      - { name: Refine,  icon: "🔍", action: "[work] /work refine {issue}" }
      - { name: Docs,    icon: "📖", action: "[work] /work docs {issue}" }
      - { name: Plan,    icon: "📝", action: "[work] /work plan {issue}" }
      - { name: Build,   icon: "🔨", action: "[work] /work start {issue}: open every message that ends your turn with the recap" }
      - { name: Demo,    icon: "🎬", action: "[work] /work demo {issue}: write the recap of the build first" }
      - { name: Review,  icon: "👀", action: "[work] /work review {issue}" }
      - { name: Merge,   icon: "🔀", action: "[work] /work merge {issue}" }
      - { name: Done,    icon: "✅", done: true }
  story: { type: text, card: true }                  # a word on an issue, to group it with others; card shows it on the board
  priority:
    card: true
    default: normal
    values:
      - { name: low,    icon: "🔵" }
      - { name: normal, icon: "⚪" }
      - { name: high,   icon: "🔴" }
  type: [bug, feature, config, duplicate, wontfix]   # what kind of issue this is
  risk: [low, medium, high]                          # the change's blast radius: its code, files and complexity

on:                                                  # the rules: what else is typed into a session when an event happens (docs/user/reference/events.md)
  merged:
    event: issue.merged
    action: "[work] Merged into {base}"
  handled:
    event: question.answered
    where: { by: handled }
    action: "[work] Handled elsewhere: {ask}"
  unhandled:
    event: question.reopened
    action: "[work] Open again, not handled: {ask}"
