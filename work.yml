# The default workflow: nine Status values, seven verbs typed by the daemon, and the agents those
# verbs spawn (examples/default/README.md). Every key and its meaning: docs/user/reference/work-yml.md.
#
# `work init --template default` writes `board:` with the board it creates, and `base:` with this repo's
# default branch; edit `base` if worktrees should branch from another. `branch` and `worktree.path`
# are left out so the machine-wide naming in ~/.work/config.yml applies.
name: flow                                           # the project's name; its issues' ids are flow-1, flow-2 …
base: main

agents:                                              # what claude is started as; a key left out runs on Claude Code's default
  leader:   { model: opus, permissions: bypassPermissions }   # every issue's session: passed to claude as --model and --permission-mode
  builder:  { model: opus }                          # the others are read by the repo's skill, which passes each when it spawns that agent
  secops:   { model: opus }
  codeops:  { model: opus }
  docops:   { model: opus }
  devops:   { model: opus }

environments:                                        # flow guards itself through dist/, which git does not carry: install and build before the session starts, or every tool call is refused
  worktree:
    create: "git -C {repo} worktree add {path} -b {branch} origin/{base} && cd {path} && just install && just build && echo {path}"
    existing: "git -C {repo} worktree prune && git -C {repo} worktree add {path} {branch} && cd {path} && just install && just build && echo {path}"
    remove: "git -C {repo} worktree remove {folder} && git -C {repo} branch -D {branch}"

sessions:                                            # default is every numbered issue's session
  default:
    environment: worktree
    agent: leader
    teardown: archived                               # archiving the card tears the session and its worktree down

fields:                                              # every field is a key in each issue's front matter; status is the one the daemon acts on
  status:
    default: Backlog
    values:                                          # icon is shown in the TUI's rows; send is typed when an issue enters the value, a list as one message per item, a line starting with ! run as a shell command
      - { name: Backlog, icon: "📥" }
      - { name: Refine, icon: "🔍", send: "[work] /work refine {issue}" }
      - { name: Docs, icon: "📖", send: "[work] /work docs {issue}" }
      - { name: Plan, icon: "📝", send: "[work] /work plan {issue}" }
      - { name: Build, icon: "🔨", send: "[work] /work start {issue}: open every message that ends your turn with the recap" }
      - { name: Demo, icon: "🎬", send: "[work] /work demo {issue}: write the recap of the build first" }
      - { name: Review, icon: "👀", send: "[work] /work review {issue}" }
      - { name: Merge, icon: "🔀", send: "[work] /work merge {issue}" }
      - { name: Done, icon: "✅" }
  type: [bug, feature, config, duplicate, wontfix]   # what kind of issue this is
  risk: [low, medium, high]                          # the change's blast radius: its code, files and complexity
